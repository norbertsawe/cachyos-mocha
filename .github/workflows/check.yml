name: Validate dotfiles
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop entry validator
        run: sudo apt-get update -qq && sudo apt-get install -y desktop-file-utils
      - name: Validate launchers
        run: desktop-file-validate share/applications/*.desktop session/*.desktop
      - name: Check shell syntax
        run: bash -n install.sh bin/* session/cachyos-mocha-session
      - name: Test installation and recovery
        run: python3 -m unittest discover -s tests -v
      - name: Parse Waybar configuration
        run: python3 -m json.tool config/waybar/config.jsonc > /dev/null
