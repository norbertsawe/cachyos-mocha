# Fuzzel Configuration
# Save to ~/.config/fuzzel/fuzzel.ini

[main]
font=JetBrainsMono Nerd Font:size=12
prompt="❯ "
icon-theme=Papirus-Dark
fields=filename,name,generic,exec,categories,keywords
terminal=kitty
lines=4
width=35
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=20
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=1e1e2eee
text=cdd6f4ff
match=cba6f7ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
border=cba6f7ff

[border]
width=2
radius=5

[dmenu]
mode=text
