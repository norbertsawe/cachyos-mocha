# ==============================================================================
# HYPRLOCK CONFIGURATION - CATPPUCCIN MOCHA
# ==============================================================================

background {
    monitor =
    color = rgb(1e1e2e)

    blur_passes = 3             # Frosted glass blur effect
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.33            # Scale of input dots relative to input box height
    dots_spacing = 0.15         # Spacing between dots
    dots_center = true

    fade_on_empty = false
    placeholder_text = 🔒 Enter Password...
    font_family = JetBrainsMono Nerd Font

    # Catppuccin Mocha Colors
    outer_color = rgba(181825cc)   # Mantle
    inner_color = rgba(313244ff)   # Surface0
    font_color = rgba(cdd6f4ff)    # Text

    check_color = rgba(f9e2afff)   # Yellow during check
    fail_color = rgba(f38ba8ff)    # Red on failure
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    capslock_color = rgba(fab387ff) # Peach
    position = 0, -20
    halign = center
    valign = center
}

# ==============================================================================
# TIME CLOCK
# ==============================================================================
label {
    monitor =
    text = cmd[update:1000] echo "<b><big>$(date +"%H:%M")</big></b>"
    color = rgba(166, 227, 161, 1)  # Green accent (matches your Waybar clock)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

# ==============================================================================
# DATE LABEL
# ==============================================================================
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B")"
    color = rgba(137, 180, 250, 1)  # Blue accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
