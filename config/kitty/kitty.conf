font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13
background_opacity 1

window_padding_width  8
confirm_os_window_close 0
hide_window_decorations yes
remember_window_size   yes
initial_window_width   1000
initial_window_height  650






# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME


# Enables the cursor trail (value is the trigger time in milliseconds, e.g., 3 or 10)
cursor_trail 3

# Controls how fast the trail fades away (min and max decay time in seconds)
cursor_trail_decay 0.1 0.4

# Sets the minimum cell distance required before a trail triggers
cursor_trail_start_threshold 2

# Optional: Set trail color explicitly (e.g., Catppuccin Mauve)
cursor_trail_color #cba6f7
