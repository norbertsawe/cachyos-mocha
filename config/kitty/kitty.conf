# ==============================================================================
# FONTS
# ==============================================================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Text Layout & Rendering
adjust_line_height  110%
adjust_column_width 100%
disable_ligatures   never

# ==============================================================================
# WINDOW LAYOUT & PADDING
# ==============================================================================
window_padding_width    10 12
confirm_os_window_close 0
hide_window_decorations yes
remember_window_size    yes
initial_window_width    1000
initial_window_height   650

# Subtle background transparency & blur (works seamlessly with Hyprland)
background_opacity      1
dynamic_background_opacity yes

# ==============================================================================
# CURSOR & TRAIL EFFECT
# ==============================================================================
cursor_shape            beam
cursor_beam_thickness   1.8
cursor_blink_interval   0.6

# Cursor Trail Effect
cursor_trail            3
cursor_trail_decay      0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color      #cba6f7

# ==============================================================================
# TAB BAR STYLE (Pill / Powerline Look)
# ==============================================================================
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# ==============================================================================
# CATPPUCCIN MOCHA COLOR PALETTE (colors.conf)
# ==============================================================================
# The basic colors
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# Cursor colors
cursor                  #f5e0dc
cursor_text_color       #1e1e2e

# URL underline color when hovering
url_color               #f5e0dc

# Kitty window border colors
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f38ba8

# OS Window titlebar colors
wayland_titlebar_color  system
macos_titlebar_color    system

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# The 16 terminal colors

# black
color0 #45475a
color8 #585b70

# red
color1 #f38ba8
color9 #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #bac2de
color15 #a6adc8

# Use the bundled CachyOS Zsh and Powerlevel10k setup.
shell zsh
